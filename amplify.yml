# Amplify Hosting build: tests, then the branch's backend, then the PWA built against it.
version: 1
backend:
  phases:
    build:
      commands:
        - nvm use 22 || nvm install 22
        - npm ci --cache .npm --prefer-offline
        # A failing test stops the deploy before anything changes.
        - npm test
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || nvm install 22
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
