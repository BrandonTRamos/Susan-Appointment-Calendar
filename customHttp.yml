customHeaders:
  - pattern: '**/*'
    headers:
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.amazonaws.com wss://*.amazonaws.com; frame-src 'none'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
      - key: X-Frame-Options
        value: DENY
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: no-referrer
      - key: Strict-Transport-Security
        value: max-age=31536000
      - key: Permissions-Policy
        value: 'camera=(), microphone=(), geolocation=()'
  # The service worker, page shell and manifest must always revalidate, or deploys never reach the installed app.
  - pattern: '/sw.js'
    headers:
      - key: Cache-Control
        value: 'no-cache'
  - pattern: '/index.html'
    headers:
      - key: Cache-Control
        value: 'no-cache'
  - pattern: '/manifest.webmanifest'
    headers:
      - key: Cache-Control
        value: 'no-cache'
